name: Expire builder artifacts and history
# Housekeeping for the builder, using only the built-in GITHUB_TOKEN — the
# builder stores no secrets anywhere:
#   - built clients (artifacts) are removed ~1 hour after their build
#   - completed build/cleanup run history is removed after 24 hours
#   - abandoned mod-upload branches are removed after 6 hours
# Website deploy history is left untouched on purpose.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: expire-builder-artifacts
  cancel-in-progress: false

env:
  ARTIFACT_MAX_AGE_HOURS: "1"
  RUN_MAX_AGE_HOURS: "24"
  BRANCH_MAX_AGE_HOURS: "6"

jobs:
  cleanup:
    name: Delete expired artifacts, runs and upload branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove expired built clients (artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAX_AGE_HOURS: ${{ env.ARTIFACT_MAX_AGE_HOURS }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          max_age=$(( MAX_AGE_HOURS * 3600 ))
          deleted=0

          while IFS=$'\t' read -r artifact_id name created_at expired; do
            [ -n "${artifact_id:-}" ] || continue
            created_epoch=$(date -u -d "$created_at" +%s)
            age=$((now - created_epoch))
            if [ "$expired" = "true" ] || [ "$age" -ge "$max_age" ]; then
              echo "Deleting artifact $name (age: ${age}s, expired: $expired)"
              gh api --method DELETE "repos/$REPOSITORY/actions/artifacts/$artifact_id" || true
              deleted=$((deleted + 1))
            fi
          done < <(
            gh api --paginate "repos/$REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .name, .created_at, (.expired|tostring)] | @tsv'
          )

          echo "Deleted $deleted artifact(s)."

      - name: Remove old build/cleanup workflow run history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAX_AGE_HOURS: ${{ env.RUN_MAX_AGE_HOURS }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          max_age=$(( MAX_AGE_HOURS * 3600 ))
          deleted=0

          for workflow in build.yml cleanup.yml; do
            echo "Checking completed runs for $workflow"
            while IFS=$'\t' read -r run_id created_at; do
              [ -n "${run_id:-}" ] || continue
              created_epoch=$(date -u -d "$created_at" +%s)
              age=$((now - created_epoch))
              if [ "$age" -ge "$max_age" ]; then
                echo "Deleting workflow run $run_id (age: ${age}s)"
                gh api --method DELETE "repos/$REPOSITORY/actions/runs/$run_id" || true
                deleted=$((deleted + 1))
              fi
            done < <(
              gh api --paginate "repos/$REPOSITORY/actions/workflows/$workflow/runs?per_page=100" \
                --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv'
            )
          done

          echo "Deleted $deleted workflow run(s)."

      - name: Remove abandoned mod-upload branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAX_AGE_HOURS: ${{ env.BRANCH_MAX_AGE_HOURS }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          max_age=$(( MAX_AGE_HOURS * 3600 ))
          deleted=0

          while IFS=$'\t' read -r branch last_commit_at; do
            [ -n "${branch:-}" ] || continue
            last_commit_epoch=$(date -u -d "$last_commit_at" +%s)
            age=$((now - last_commit_epoch))
            if [ "$age" -ge "$max_age" ]; then
              echo "Deleting abandoned upload branch $branch (age: ${age}s)"
              gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch" || true
              deleted=$((deleted + 1))
            fi
          done < <(
            gh api --paginate "repos/$REPOSITORY/branches?per_page=100" \
              --jq '.[] | select(.name | startswith("builder-upload-")) | [.name, .commit.commit.committer.date] | @tsv'
          )

          echo "Deleted $deleted abandoned upload branch(es)."
