name: Build Horizon client
# Compiles horizon-client for one desktop platform, optionally with source-based
# .hnmod native mods applied into the Horizon workspace first. Dispatched by the
# builder website (web/) with the visitor's own token; the workflow itself only
# ever uses the built-in GITHUB_TOKEN.
#
# Mixed-revision mods: instead of trusting (or forcing) the requested Horizon
# ref, scripts/probe_revisions.sh tries the requested commit first and then
# every mod's pinned commit (newest first), and the build lands on the first
# revision where the mixin tooling still resolves every mod's source anchors.
on:
  workflow_dispatch:
    inputs:
      horizon_ref:
        description: "Preferred Horizon branch, tag, or commit SHA"
        required: true
        type: string
        default: main
      platform:
        description: "Target platform"
        required: true
        type: choice
        options: [windows-x64, linux-x64, linux-arm64, macos-arm64]
        default: windows-x64
      profile:
        description: "Cargo build profile"
        required: true
        type: choice
        options: [fast, release]
        default: fast
      upload_branch:
        description: "Temporary branch holding the uploaded .hnmod files (empty = no mods)"
        required: false
        type: string
        default: ""
      override_revisions:
        description: "(Deprecated and ignored - mod pins are probed automatically now)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HORIZON_MIXINS_REVISION: d9c83d7096b7ea5b83678da2efdfd6161f74997e

jobs:
  build:
    name: ${{ inputs.platform }} / ${{ inputs.profile }}
    runs-on: ${{ inputs.platform == 'windows-x64' && 'windows-latest' || inputs.platform == 'linux-x64' && 'ubuntu-latest' || inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'macos-14' }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      BUILD_PROFILE: ${{ inputs.profile || 'fast' }}
      BUILD_PLATFORM: ${{ inputs.platform || 'windows-x64' }}
      REQUESTED_HORIZON_REF: ${{ inputs.horizon_ref }}
      UPLOAD_BRANCH: ${{ inputs.upload_branch }}
      RUSTFLAGS: ${{ inputs.platform == 'windows-x64' && '-C target-feature=+crt-static' || '' }}
    steps:
      - name: Checkout builder scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preserve LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download uploaded .hnmod files
        if: ${{ inputs.upload_branch != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.upload_branch }}
          path: mods-upload
          persist-credentials: false

      - name: Validate and unpack uploaded .hnmod files
        id: mods
        if: ${{ inputs.upload_branch != '' }}
        run: |
          OUT=$(python scripts/prepare_mods.py --input-dir mods-upload/mods --output-dir mods)
          echo "$OUT"
          COUNT=$(printf '%s' "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Collect the mods' pinned Horizon revisions
        id: pins
        if: ${{ inputs.upload_branch != '' && steps.mods.outputs.count != '0' }}
        run: |
          PINS=$(python scripts/prepare_mods.py --list-pins --output-dir mods)
          echo "Mod-pinned Horizon revisions: $PINS"
          echo "pins_json=$PINS" >> "$GITHUB_OUTPUT"

      - name: Checkout the preferred Horizon source
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ inputs.horizon_ref }}
          path: horizon
          fetch-depth: 0
          persist-credentials: false

      - name: Record the requested Horizon commit
        id: horizon
        run: |
          REV=$(git -C horizon rev-parse HEAD)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "Requested Horizon commit: $REV"
          echo "FINAL_HORIZON_COMMIT=$REV" >> "$GITHUB_ENV"

      - name: Re-checkout Horizon files with LF endings
        run: |
          cd horizon
          git config core.autocrlf false
          git checkout-index --force --all

      - name: Materialize tracked Horizon symlinks
        run: bash scripts/materialize-symlinks.sh horizon

      - name: Install Linux native build packages
        if: startsWith(inputs.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev

      - name: Install macOS native build tools
        if: startsWith(inputs.platform, 'macos-')
        run: |
          brew update
          brew install pkg-config

      - name: Checkout horizon-mixins tooling
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mixins
          ref: ${{ env.HORIZON_MIXINS_REVISION }}
          path: horizon-mixins
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Restore Rust build caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            ~/.cargo/git
            game-target
            horizon-mixins/target
          key: horizon-builder-${{ inputs.platform }}-rust-1.95.0-${{ inputs.profile }}-${{ steps.horizon.outputs.revision }}-${{ hashFiles('horizon/Cargo.lock', 'horizon-mixins/Cargo.lock') }}
          restore-keys: |
            horizon-builder-${{ inputs.platform }}-rust-1.95.0-${{ inputs.profile }}-${{ steps.horizon.outputs.revision }}-
            horizon-builder-${{ inputs.platform }}-rust-1.95.0-

      - name: Fetch pinned build dependencies
        run: |
          cargo fetch --locked --manifest-path horizon-mixins/Cargo.toml
          cargo fetch --locked --manifest-path horizon/Cargo.toml

      - name: Build the mixin planning CLI
        if: ${{ inputs.upload_branch != '' && steps.mods.outputs.count != '0' }}
        run: |
          cargo build --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli
          if [ -f horizon-mixins/target/debug/horizon-mixins.exe ]; then
            echo "MIXINS_BIN=horizon-mixins/target/debug/horizon-mixins.exe" >> "$GITHUB_ENV"
          else
            echo "MIXINS_BIN=horizon-mixins/target/debug/horizon-mixins" >> "$GITHUB_ENV"
          fi

      # The revision workaround: probe each mod's pinned commit first (newest
      # first), then the requested commit, until `plan` resolves every mod's
      # source anchors. Genuinely incompatible mods fail here with a report
      # instead of producing a broken client later.
      - name: Plan mods while probing mod-pinned revisions
        if: ${{ inputs.upload_branch != '' && steps.mods.outputs.count != '0' }}
        env:
          PINS_JSON: ${{ steps.pins.outputs.pins_json }}
        run: bash scripts/probe_revisions.sh

      - name: Apply all selected native mods
        if: ${{ inputs.upload_branch != '' && steps.mods.outputs.count != '0' }}
        run: |
          "$MIXINS_BIN" apply --workspace horizon --mods mods --out game-stage

      # Mods that vendor C code are usually built with GCC/Clang flags, and
      # MSVC rejects the most common one (opus's -DVAR_ARRAYS enables C99
      # variable-length arrays, which cl.exe cannot compile). Rewrite the
      # staged crates' build scripts to the portable alloca mode before
      # cargo sees them.
      - name: Shim MSVC-incompatible mod crate build scripts
        if: ${{ startsWith(inputs.platform, 'windows-') && inputs.upload_branch != '' && steps.mods.outputs.count != '0' }}
        run: python scripts/patch_native_compat.py --stage game-stage --target x86_64-pc-windows-msvc

      - name: Select build workspace
        id: workspace
        run: |
          if [ -f game-stage/Cargo.toml ]; then
            echo "manifest=game-stage/Cargo.toml" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=horizon/Cargo.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Horizon client (fast)
        if: ${{ inputs.profile != 'release' }}
        run: |
          cargo build --profile fast --locked -p horizon-client --bin horizon-client --manifest-path "${{ steps.workspace.outputs.manifest }}" --target-dir game-target

      - name: Build Horizon client (release)
        if: ${{ inputs.profile == 'release' }}
        run: |
          cargo build --release --locked -p horizon-client --bin horizon-client --manifest-path "${{ steps.workspace.outputs.manifest }}" --target-dir game-target

      - name: Set executable filename
        id: output
        run: |
          if [ "$BUILD_PLATFORM" = "windows-x64" ]; then
            echo "filename=horizon-client.exe" >> "$GITHUB_OUTPUT"
          else
            echo "filename=horizon-client" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify executable
        run: |
          BIN="game-target/$BUILD_PROFILE/${{ steps.output.outputs.filename }}"
          test -f "$BIN"
          chmod +x "$BIN"
          "$BIN" --help | grep -q -- '--resources'

      - name: Save Rust build caches
        if: always() && steps.cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            ~/.cargo/git
            game-target
            horizon-mixins/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Stage build outputs
        run: |
          mkdir -p publish
          cp "game-target/$BUILD_PROFILE/${{ steps.output.outputs.filename }}" "publish/${{ steps.output.outputs.filename }}"
          {
            echo "Horizon Client Builder"
            echo "Platform: $BUILD_PLATFORM"
            echo "Build profile: $BUILD_PROFILE"
            echo "Requested Horizon ref: $REQUESTED_HORIZON_REF"
            echo "Resolved Horizon commit: $FINAL_HORIZON_COMMIT"
            echo "Builder commit: $GITHUB_SHA"
            echo
            echo "Revision probe:"
            if [ -n "${PROBE_REPORT:-}" ]; then
              printf '%s\n' "$PROBE_REPORT"
            else
              echo "Not needed (clean client, or the requested revision already matched)."
            fi
            echo
            echo "Native-crate toolchain shims:"
            if [ -n "${COMPAT_PATCH_REPORT:-}" ]; then
              printf '%s\n' "$COMPAT_PATCH_REPORT"
            else
              echo "None (clean client, non-Windows target, or nothing to shim)."
            fi
            echo
            echo "Included .hnmod files:"
            if [ -f target/mixins/plan.json ]; then
              python -c 'import json; print(json.dumps(json.load(open("target/mixins/plan.json")), indent=2))'
            else
              echo "None (clean client)"
            fi
          } > publish/build-info.txt

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-client-${{ inputs.platform }}
          path: publish/*
          if-no-files-found: error
          # Hard floor is one day; the scheduled cleanup deletes builder
          # artifacts one hour after they are created.
          retention-days: 1

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Horizon Client Builder"
            echo "- Platform: $BUILD_PLATFORM"
            echo "- Profile: $BUILD_PROFILE"
            echo "- Requested Horizon ref: $REQUESTED_HORIZON_REF"
            echo "- Resolved Horizon commit: ${FINAL_HORIZON_COMMIT:-unknown}"
            echo "- Artifact: \`horizon-client-${{ inputs.platform }}\` (deleted about an hour after the build)"
            if [ -n "${PROBE_REPORT:-}" ]; then
              echo
              echo "### Revision probe"
              echo
              echo '```'
              printf '%s\n' "$PROBE_REPORT"
              echo '```'
            fi
            if [ -n "${COMPAT_PATCH_REPORT:-}" ]; then
              echo
              echo "### Native-crate toolchain shims"
              echo
              echo '```json'
              printf '%s\n' "$COMPAT_PATCH_REPORT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-upload:
    name: Delete temporary mod-upload branch
    if: ${{ always() && inputs.upload_branch != '' }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_BRANCH: ${{ inputs.upload_branch }}
        run: |
          case "$UPLOAD_BRANCH" in
            builder-upload-*) gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$UPLOAD_BRANCH" && echo "Deleted $UPLOAD_BRANCH" || echo "Could not delete $UPLOAD_BRANCH (the scheduled cleanup will catch it)" ;;
            *) echo "Not deleting unexpected branch name: $UPLOAD_BRANCH" ;;
          esac
