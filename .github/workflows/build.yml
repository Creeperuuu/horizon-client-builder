name: Build Horizon client
# Compiles horizon-client for one desktop platform, optionally with source-based
# .hnmod native mods applied into the Horizon workspace first. Dispatched by the
# builder website (web/) with the visitor's own token; the workflow itself only
# ever uses the built-in GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      horizon_ref:
        description: "Horizon branch, tag, or commit SHA"
        required: true
        type: string
        default: main
      platform:
        description: "Target platform"
        required: true
        type: choice
        options: [windows-x64, linux-x64, linux-arm64, macos-arm64]
        default: windows-x64
      profile:
        description: "Cargo build profile"
        required: true
        type: choice
        options: [fast, release]
        default: fast
      upload_branch:
        description: "Temporary branch holding the uploaded .hnmod files (empty = no mods)"
        required: false
        type: string
        default: ""
      override_revisions:
        description: "Rewrite every mod's [compatibility].horizon_revision to this build's Horizon commit"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  HORIZON_MIXINS_REVISION: d9c83d7096b7ea5b83678da2efdfd6161f74997e
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    name: ${{ inputs.platform }} / ${{ inputs.profile }}
    runs-on: ${{ inputs.platform == 'windows-x64' && 'windows-latest' || inputs.platform == 'linux-x64' && 'ubuntu-latest' || inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'macos-14' }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      BUILD_PROFILE: ${{ inputs.profile || 'fast' }}
      BUILD_PLATFORM: ${{ inputs.platform || 'windows-x64' }}
      REQUESTED_HORIZON_REF: ${{ inputs.horizon_ref }}
      OVERRIDE_REVISIONS: ${{ inputs.override_revisions }}
      UPLOAD_BRANCH: ${{ inputs.upload_branch }}
      RUSTFLAGS: ${{ inputs.platform == 'windows-x64' && '-C target-feature=+crt-static' || '' }}
    steps:
      - name: Checkout builder scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preserve LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download uploaded .hnmod files
        if: ${{ inputs.upload_branch != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.upload_branch }}
          path: mods-upload
          persist-credentials: false

      - name: Validate and unpack uploaded .hnmod files
        if: ${{ inputs.upload_branch != '' }}
        run: python scripts/prepare_mods.py --input-dir mods-upload/mods --output-dir mods

      - name: Resolve the Horizon revision to build
        id: resolve
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          requested = os.environ["REQUESTED_HORIZON_REF"].strip()
          override = os.environ["OVERRIDE_REVISIONS"] == "true"

          pinned = set()
          if not override:
              # Strict mode: mods keep their say. A single agreeing pin wins;
              # disagreeing pins are exactly what the override exists for.
              for manifest_path in sorted(Path("mods").glob("*/horizon-mixin.toml")):
                  with manifest_path.open("rb") as stream:
                      manifest = tomllib.load(stream)
                  revision = manifest.get("compatibility", {}).get("horizon_revision")
                  if revision:
                      if not isinstance(revision, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", revision):
                          raise SystemExit(f"Invalid exact Horizon revision in {manifest_path}: {revision!r}")
                      pinned.add(revision)
              if len(pinned) > 1:
                  raise SystemExit(
                      "Selected mods pin different Horizon revisions ("
                      + ", ".join(sorted(pinned))
                      + "). Enable 'Override mod revisions' on the builder site to build them together."
                  )

          resolved = next(iter(pinned)) if pinned else requested
          print(f"Resolved Horizon ref: {resolved} (requested: {requested}, override: {override})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("ref=" + resolved + "\n")
          PY

      - name: Checkout selected Horizon source
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ steps.resolve.outputs.ref }}
          path: horizon
          fetch-depth: 0
          persist-credentials: false

      - name: Record resolved Horizon commit
        id: horizon
        run: |
          REV=$(git -C horizon rev-parse HEAD)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "Resolved Horizon commit: $REV"
          echo "RESOLVED_HORIZON_REF=${{ steps.resolve.outputs.ref }}" >> "$GITHUB_ENV"

      - name: Re-checkout Horizon files with LF endings
        run: |
          cd horizon
          git config core.autocrlf false
          git checkout-index --force --all

      - name: Materialize tracked Horizon symlinks
        run: |
          cd horizon
          git ls-files -s | awk '$1 == 120000 {print $4}' | while IFS= read -r link; do
            [ -n "$link" ] || continue
            target=$(git cat-file blob "HEAD:$link")
            rm -f "$link"
            cp -L "$target" "$link"
          done

      - name: Install Linux native build packages
        if: startsWith(inputs.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev

      - name: Install macOS native build tools
        if: startsWith(inputs.platform, 'macos-')
        run: |
          brew update
          brew install pkg-config

      - name: Checkout horizon-mixins tooling
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mixins
          ref: ${{ env.HORIZON_MIXINS_REVISION }}
          path: horizon-mixins
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@${{ env.RUST_TOOLCHAIN }}

      - name: Restore Rust build caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            ~/.cargo/git
            game-target
            horizon-mixins/target
          key: horizon-builder-${{ inputs.platform }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ inputs.profile }}-${{ steps.horizon.outputs.revision }}-${{ hashFiles('horizon/Cargo.lock', 'horizon-mixins/Cargo.lock') }}
          restore-keys: |
            horizon-builder-${{ inputs.platform }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ inputs.profile }}-${{ steps.horizon.outputs.revision }}-
            horizon-builder-${{ inputs.platform }}-rust-${{ env.RUST_TOOLCHAIN }}-

      # The revision workaround: mods compiled against other Horizon commits are
      # re-pinned to this build's commit so they no longer veto (or conflict
      # with) the checkout. Whether the result actually applies is then decided
      # by the mixin tooling, not by the manifest.
      - name: Override mod revisions to this build's Horizon commit
        if: ${{ inputs.upload_branch != '' && inputs.override_revisions }}
        run: python scripts/prepare_mods.py --rewrite-staged --output-dir mods --force-revision "${{ steps.horizon.outputs.revision }}"

      - name: Fetch pinned build dependencies
        run: |
          cargo fetch --locked --manifest-path horizon-mixins/Cargo.toml
          cargo fetch --locked --manifest-path horizon/Cargo.toml

      - name: Plan all selected native mods together
        if: ${{ inputs.upload_branch != '' }}
        run: |
          rm -rf target/mixins
          mkdir -p target/mixins
          cargo run --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli -- \
            plan --workspace horizon --mods mods --out target/mixins/plan.json

      - name: Apply all selected native mods
        if: ${{ inputs.upload_branch != '' }}
        run: |
          cargo run --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli -- \
            apply --workspace horizon --mods mods --out game-stage

      - name: Select build workspace
        id: workspace
        run: |
          if [ -f game-stage/Cargo.toml ]; then
            echo "manifest=game-stage/Cargo.toml" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=horizon/Cargo.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Horizon client (fast)
        if: ${{ inputs.profile != 'release' }}
        run: cargo build --profile fast --locked -p horizon-client --bin horizon-client \
          --manifest-path "${{ steps.workspace.outputs.manifest }}" --target-dir game-target

      - name: Build Horizon client (release)
        if: ${{ inputs.profile == 'release' }}
        run: cargo build --release --locked -p horizon-client --bin horizon-client \
          --manifest-path "${{ steps.workspace.outputs.manifest }}" --target-dir game-target

      - name: Set executable filename
        id: output
        run: |
          if [ "$BUILD_PLATFORM" = "windows-x64" ]; then
            echo "filename=horizon-client.exe" >> "$GITHUB_OUTPUT"
          else
            echo "filename=horizon-client" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify executable
        run: |
          BIN="game-target/$BUILD_PROFILE/${{ steps.output.outputs.filename }}"
          test -f "$BIN"
          chmod +x "$BIN"
          "$BIN" --help | grep -q -- '--resources'

      - name: Save Rust build caches
        if: always() && steps.cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            ~/.cargo/git
            game-target
            horizon-mixins/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Stage build outputs
        run: |
          mkdir -p publish
          cp "game-target/$BUILD_PROFILE/${{ steps.output.outputs.filename }}" "publish/${{ steps.output.outputs.filename }}"
          {
            echo "Horizon Client Builder"
            echo "Platform: $BUILD_PLATFORM"
            echo "Build profile: $BUILD_PROFILE"
            echo "Requested Horizon ref: $REQUESTED_HORIZON_REF"
            echo "Resolved Horizon ref: $RESOLVED_HORIZON_REF"
            echo "Horizon commit: ${{ steps.horizon.outputs.revision }}"
            echo "Revision override: $OVERRIDE_REVISIONS"
            echo "Builder commit: $GITHUB_SHA"
            echo
            echo "Included .hnmod files:"
            if [ -f target/mixins/plan.json ]; then
              python -c 'import json; print(json.dumps(json.load(open("target/mixins/plan.json")), indent=2))'
            else
              echo "None (clean client)"
            fi
          } > publish/build-info.txt

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-client-${{ inputs.platform }}
          path: publish/*
          if-no-files-found: error
          # Hard floor is one day; the scheduled cleanup deletes builder
          # artifacts one hour after they are created.
          retention-days: 1

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Horizon Client Builder"
            echo "- Platform: $BUILD_PLATFORM"
            echo "- Profile: $BUILD_PROFILE"
            echo "- Requested Horizon ref: $REQUESTED_HORIZON_REF"
            echo "- Resolved Horizon ref: $RESOLVED_HORIZON_REF"
            echo "- Resolved Horizon commit: ${{ steps.horizon.outputs.revision }}"
            echo "- Revision override: $OVERRIDE_REVISIONS"
            echo "- Artifact: \`horizon-client-${{ inputs.platform }}\` (deleted about an hour after the build)"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-upload:
    name: Delete temporary mod-upload branch
    if: ${{ always() && inputs.upload_branch != '' }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_BRANCH: ${{ inputs.upload_branch }}
        run: |
          case "$UPLOAD_BRANCH" in
            builder-upload-*) gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$UPLOAD_BRANCH" && echo "Deleted $UPLOAD_BRANCH" || echo "Could not delete $UPLOAD_BRANCH (the scheduled cleanup will catch it)" ;;
            *) echo "Not deleting unexpected branch name: $UPLOAD_BRANCH" ;;
          esac
